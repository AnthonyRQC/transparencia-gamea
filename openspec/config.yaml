schema: spec-driven

context: |
  Sistema de Gestión de Denuncias para la UTLCC / GAMEA bajo el marco de la Ley N° 974.
  Marco legal y de privacidad:
  - Reserva de identidad y confidencialidad del denunciante (Arts. 24 y 29, Ley 974).
  - Plazos legales fatales: 5 días hábiles para admisión/rechazo, 45 días hábiles para investigación (corrupción), 20 días hábiles (negación de información), más ampliaciones autorizadas.
  - Bitácora append-only: no admite edición ni borrado; prohibido persistir dirección IP (capturar solo user_agent truncado a 512).
  
  Stack técnico y convenciones:
  - Stack: Laravel 13, PHP 8.3, React 18, Inertia.js v2, Tailwind CSS v3, Shadcn UI.
  - Tests: Verificación automatizada con PHPUnit (SQLite en memoria).
  - Idioma: Especificaciones OpenSpec en inglés; interfaces de usuario (UI), labels, mensajes y textos de dominio en español.
  - Documentación: Jerarquía de verdad formal en DOCS.md y ADR D30; no leer notas históricas ni archivo/ para contexto operativo.

rules:
  spec:
    - Write specifications in English with clear Requirements and Scenarios.
    - Enforce Ley 974 constraints (confidentiality Arts. 24/29, statutory deadlines 5/45/20, append-only traceability).
  proposal:
    - Explicitly state problem, scope, constraints, and non-goals.
    - Do not read historical files or closed sprint archives for operational context.
  tasks:
    - Define focused PHPUnit test and build verification for each task.
    - Mark all tasks as completed before running openspec archive.
